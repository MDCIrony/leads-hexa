[project]
name = "chassis"
version = "0.1.0"
description = "Cross-cutting infrastructure shared by every Lead Router service"
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chassis"]

[dependency-groups]
dev = ["pytest>=8.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
