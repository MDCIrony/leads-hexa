[project]
name = "chassis"
version = "0.1.0"
description = "Cross-cutting infrastructure shared by every Lead Router service"
requires-python = ">=3.12"
dependencies = [
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.5.0"]
rabbit = ["pika>=1.3.0"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chassis"]

[dependency-groups]
# The extras are repeated here so the tests can run against the real client libraries.
dev = ["pytest>=8.2.0", "confluent-kafka>=2.5.0", "pika>=1.3.0",
       "psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
