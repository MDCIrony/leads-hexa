# The edge (ADR-0032): routing, authentication through the phantom token,
# CORS, Origin checks and request correlation. No business rule lives here.

log_format gateway '$remote_addr "$request" $status $body_bytes_sent '
                   'rid=$req_id upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

# A client-supplied id is kept only if it is safe to write into a log line.
map $http_x_request_id $req_id {
    "~^[A-Za-z0-9._-]{1,128}$" $http_x_request_id;
    default                    $request_id;
}

# Exact match, never a prefix: http://localhost:5173.evil.test must not pass.
map $http_origin $cors_origin {
    default                 "";
    "http://localhost"      $http_origin;
    "http://localhost:80"   $http_origin;
    "http://localhost:5173" $http_origin;
}
map $cors_origin $cors_credentials { "" ""; default "true"; }

map $request_method $is_write { GET 0; HEAD 0; OPTIONS 0; TRACE 0; default 1; }
# A write that carries a foreign Origin is refused; a missing Origin (curl,
# workers, the customer's integration) is not a browser and stays allowed.
map "$is_write|$http_origin|$cors_origin" $origin_rejected {
    default      0;
    "~^1\|.+\|$" 1;
}

map "$request_method|$cors_origin" $cors_allow_methods {
    "~^OPTIONS\|.+" "GET, POST, PUT, PATCH, DELETE, OPTIONS";
    default         "";
}
map "$request_method|$cors_origin" $cors_allow_headers {
    "~^OPTIONS\|.+" $http_access_control_request_headers;
    default         "";
}

map $internal_token $internal_authorization { "" ""; default "Bearer $internal_token"; }

limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

# Docker's embedded DNS. Re-resolved so a recreated container (new IP) is
# picked up without restarting the gateway.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
    keepalive 32;
}

server {
    listen 8080;
    access_log /dev/stdout gateway;
    default_type application/json;
    client_max_body_size 10m;

    # Server level only: a location with its own add_header would drop these.
    add_header X-Request-Id                     $req_id always;
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials $cors_credentials always;
    add_header Access-Control-Allow-Methods     $cors_allow_methods always;
    add_header Access-Control-Allow-Headers     $cors_allow_headers always;
    add_header Vary                             Origin always;

    # Rewrite phase: runs before auth_request, so a hostile Origin is refused
    # without spending an introspection on it.
    if ($origin_rejected) {
        return 403 '{"error":true,"error_code":"FORBIDDEN","message":"Origen no permitido"}';
    }
    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        access_log off;
        return 200 '{"status":"ok"}';
    }

    location /internal/ {
        return 404 '{"error":true,"error_code":"NOT_FOUND","message":"Not Found"}';
    }

    location = /_introspect {
        internal;
        proxy_pass              http://backend/internal/v1/auth/introspect;
        include                 /etc/nginx/introspect.conf;
    }
    location = /_introspect_optional {
        internal;
        proxy_pass              http://backend/internal/v1/auth/introspect?optional=true;
        include                 /etc/nginx/introspect.conf;
    }

    # The authentication boundary: validates its own cookie and issues sessions.
    location /api/v1/auth/ {
        limit_req zone=auth burst=60 nodelay;
        # The default 503 would land in @unavailable and read as an outage.
        limit_req_status 429;
        include    /etc/nginx/proxy_headers.conf;
        proxy_pass http://backend;
    }

    # POST /agents creates the platform admin unauthenticated on an empty
    # database; any credential that does arrive must still be valid.
    location = /api/v1/agents {
        auth_request     /_introspect_optional;
        auth_request_set $internal_token $upstream_http_x_internal_token;
        include          /etc/nginx/proxy_headers.conf;
        proxy_set_header Cookie "";
        proxy_pass       http://backend;
    }
    location = /api/v1/agents/ {
        auth_request     /_introspect_optional;
        auth_request_set $internal_token $upstream_http_x_internal_token;
        include          /etc/nginx/proxy_headers.conf;
        proxy_set_header Cookie "";
        proxy_pass       http://backend;
    }

    # F0: every protected prefix still lands on the monolith. Each extraction
    # adds a more specific location pointing at its own upstream.
    location /api/v1/ {
        auth_request     /_introspect;
        auth_request_set $internal_token $upstream_http_x_internal_token;
        include          /etc/nginx/proxy_headers.conf;
        proxy_set_header Cookie "";
        proxy_pass       http://backend;
    }

    # Cookies never reach a service outside /auth/*.
    location = /openapi.json { include /etc/nginx/proxy_headers.conf; proxy_set_header Cookie ""; proxy_pass http://backend; }
    location = /docs         { include /etc/nginx/proxy_headers.conf; proxy_set_header Cookie ""; proxy_pass http://backend; }

    location / {
        return 404 '{"error":true,"error_code":"NOT_FOUND","message":"Not Found"}';
    }

    error_page 401 = @unauthorized;
    error_page 413 = @too_large;
    error_page 429 = @too_many;
    # auth_request turns any subrequest failure other than 401/403 into a 500.
    error_page 500 502 503 504 = @unavailable;

    location @unauthorized {
        return 401 '{"error":true,"error_code":"UNAUTHORIZED","message":"Authentication required"}';
    }
    location @too_large {
        return 413 '{"error":true,"error_code":"PAYLOAD_TOO_LARGE","message":"Request body too large"}';
    }
    location @too_many {
        return 429 '{"error":true,"error_code":"TOO_MANY_REQUESTS","message":"Too many requests"}';
    }
    location @unavailable {
        return 503 '{"error":true,"error_code":"SERVICE_UNAVAILABLE","message":"Service unavailable"}';
    }
}
