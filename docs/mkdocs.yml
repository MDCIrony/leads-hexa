site_name: Lead Router
site_description: Enrutamiento y autoasignación de leads comerciales. Arquitectura hexagonal sobre FastAPI y PostgreSQL.
site_author: Equipo Lead Router
docs_dir: content

# Nested under docs/ rather than at the repo root: the documentation is a
# subproject with its own dependencies, and content/ avoids the docs/docs/ path
# that MkDocs defaults to.

theme:
  name: material
  language: es
  icon:
    logo: material/call-split
    repo: fontawesome/brands/git-alt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Enlace a esta sección
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Mermaid renders natively through superfences: no external script tag, no
  # CDN, and the diagram source stays in the Markdown where it can be diffed.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: es

extra:
  social:
    - icon: fontawesome/brands/git-alt
      link: https://github.com
      name: Repositorio

