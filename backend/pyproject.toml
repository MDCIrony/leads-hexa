[project]
name = "lead-router-backend"
version = "0.1.0"
description = "Plataforma de Scoring, Enrutamiento y Gestión de Leads (Arquitectura Hexagonal)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: no database, no network, no environment variables",
    "integration: requires a live PostgreSQL test database",
    "e2e: full HTTP stack against a live PostgreSQL test database",
    "architecture: static analysis of the dependency rule",
]
