services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: leads_db
    ports:
      # 5433 on the host: 5432 is commonly taken by a local PostgreSQL or by
      # another project's container. Inside the compose network it is still 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      # 8001 on the host: 8000 is a common default and is often already taken.
      # Inside the compose network the API still listens on 8000.
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/leads_db
      - JWT_SECRET=dev-secret-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost,http://localhost:80
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/leads_test
      - TEST_DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/leads_test
      - JWT_SECRET=test-secret-do-not-use-in-production
    command: ["pytest", "-q"]

volumes:
  pgdata:
