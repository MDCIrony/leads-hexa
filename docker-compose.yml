services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: leads_db
    ports:
      # 5433 on the host: 5432 is commonly taken by a local PostgreSQL or by
      # another project's container. Inside the compose network it is still 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Explicit: without it, `docker build` targets the last stage in the
      # Dockerfile, and this service would silently run pytest instead of
      # serving the API. `dev` is `runner` plus a file watcher.
      target: dev
    # Source mounted read-only and hot-reloaded: a code change needs neither
    # `--build` nor `restart`. Without the reload the container would keep
    # serving whatever it loaded at startup, and verify-e2e.sh would pass
    # against the previous version — a green run that proves nothing.
    # Only src/ and migrations/: mounting /app would shadow the virtualenv the
    # image builds at /app/.venv and nothing would import. Read-only because the
    # container must never write back into the working tree.
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/migrations:/app/migrations:ro
    ports:
      # 8001 on the host: 8000 is a common default and is often already taken.
      # Inside the compose network the API still listens on 8000.
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/leads_db
      - JWT_SECRET=dev-secret-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost,http://localhost:80
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    # Content mounted, config baked in: writing a page shows up on save without
    # rebuilding. Read-only because the site generator must never write back
    # into the working tree.
    volumes:
      - ./docs/content:/docs/content:ro
    ports:
      # 8002: 8000 and 8001 are taken by the API's container and host ports.
      - "8002:8000"
    # No dependency on db or backend: documentation must be readable when the
    # product does not start, which is exactly when it is needed most.

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    # Same reasoning as `backend`, plus tests/. This is what makes `--build`
    # unnecessary on every run: the suite executes the working tree as it is.
    # Rebuild only when pyproject.toml or uv.lock change.
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/leads_test
      - TEST_DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/leads_test
      - JWT_SECRET=test-secret-do-not-use-in-production
      # The mounts are read-only, so bytecode cannot be cached anyway; saying so
      # avoids a warning per module.
      - PYTHONDONTWRITEBYTECODE=1
    command: ["pytest", "-q"]

volumes:
  pgdata:
