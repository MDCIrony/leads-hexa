services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: leads_db
    ports:
      # 5433 on the host: 5432 is often taken by a local PostgreSQL.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-bootstrap:
    image: postgres:16-alpine
    environment:
      - PGPASSWORD=postgrespassword
    volumes:
      - ./db:/bootstrap:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-v", "notifications_password=notificationspassword", "-v", "identity_password=identitypassword", "-v", "intake_password=intakepassword", "-v", "lead_core_password=leadcorepassword", "-f", "/bootstrap/bootstrap.sql"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  lead-core:
    build:
      context: ./services/lead-core
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    volumes:
      - ./services/lead-core/src:/srv/services/lead-core/src:ro
      - ./services/lead-core/migrations:/srv/services/lead-core/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://lead_core_svc:leadcorepassword@db:5432/leads_db
      - JWKS_URL=http://identity:8000/internal/v1/jwks
      - IDENTITY_URL=http://identity:8000
      - SERVICE_CLIENT_ID=lead-core
      - SERVICE_CLIENT_SECRET=lead-core-dev-secret-0c7f2a9e4b1d
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway:/etc/nginx/conf.d:ro
    ports:
      - "8001:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094,SASL_INTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094,SASL_INTERNAL://kafka:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:SASL_PLAINTEXT,SASL_INTERNAL:SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/jaas/kafka_server_jaas.conf
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./kafka/kafka_server_jaas.conf:/etc/kafka/jaas/kafka_server_jaas.conf:ro
      - kafkadata:/var/lib/kafka/data
    ports:
      - "9094:9094"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: leads
      RABBITMQ_DEFAULT_PASS: leadspassword
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: leads
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8004:8080"
    depends_on:
      - kafka

  intake-worker:
    build:
      context: ./services/intake
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    working_dir: /srv/services/intake/src
    volumes:
      - ./services/intake/src:/srv/services/intake/src:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://intake_svc:intakepassword@db:5432/intake_db
      - RABBITMQ_URL=amqp://leads:leadspassword@rabbitmq:5672/%2F
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LEAD_CORE_URL=http://lead-core:8000
      - IDENTITY_URL=http://identity:8000
      - SERVICE_CLIENT_ID=intake
      - SERVICE_CLIENT_SECRET=intake-dev-secret-a91b68b5a560
      - LOG_LEVEL=INFO
    command: ["watchfiles", "python -m infrastructure.worker", "/srv/services/intake/src", "/srv/libs/chassis/src"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      intake:
        condition: service_healthy
    # Lets an in-flight intake job (minutes for 10k records) finish before the container stops.
    stop_grace_period: 5m
    restart: on-failure

  lead-core-worker:
    build:
      context: ./services/lead-core
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    working_dir: /srv/services/lead-core/src
    volumes:
      - ./services/lead-core/src:/srv/services/lead-core/src:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://lead_core_svc:leadcorepassword@db:5432/leads_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=INFO
    command: ["watchfiles", "python -m infrastructure.worker", "/srv/services/lead-core/src", "/srv/libs/chassis/src"]
    depends_on:
      lead-core:
        condition: service_healthy
    restart: on-failure

  identity:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    volumes:
      - ./services/identity/src:/srv/services/identity/src:ro
      - ./services/identity/migrations:/srv/services/identity/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://identity_svc:identitypassword@db:5432/identity_db
      - MFA_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # Development-only keys and secrets in this file: never reuse them outside this stack.
      - SIGNING_KEYS=dev-1=_tS3Kljdu1EaOrOFVqdVQ2G1VaP7q5pWZKmqPb9W-mU
      - SERVICE_CLIENTS=lead-core:identity:21c1a510ed8f851deccca537c6c7d35aed463034a5c938518a607bdfa9eaf93d,intake:lead-core:a565768fddaddf20edac7326fb55c2b0eb222509797d76a16e0823a87bfe9c63
      - CORS_ORIGINS=http://localhost:5173,http://localhost,http://localhost:80
      - FRONTEND_ORIGIN=http://localhost
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8001/api/v1/auth/oauth/google/callback}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://localhost:8001/api/v1/auth/oauth/github/callback}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_EXTERNAL_BOOTSTRAP_SERVERS=localhost:9094
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  identity-worker:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    working_dir: /srv/services/identity/src
    volumes:
      - ./services/identity/src:/srv/services/identity/src:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://identity_svc:identitypassword@db:5432/identity_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=INFO
    command: ["watchfiles", "python -m infrastructure.worker", "/srv/services/identity/src", "/srv/libs/chassis/src"]
    depends_on:
      identity:
        condition: service_healthy
    restart: on-failure

  intake:
    build:
      context: ./services/intake
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    volumes:
      - ./services/intake/src:/srv/services/intake/src:ro
      - ./services/intake/migrations:/srv/services/intake/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://intake_svc:intakepassword@db:5432/intake_db
      - JWKS_URL=http://identity:8000/internal/v1/jwks
      - LEAD_CORE_URL=http://lead-core:8000
      - IDENTITY_URL=http://identity:8000
      - SERVICE_CLIENT_ID=intake
      - SERVICE_CLIENT_SECRET=intake-dev-secret-a91b68b5a560
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    volumes:
      - ./services/notifications/src:/srv/services/notifications/src:ro
      - ./services/notifications/migrations:/srv/services/notifications/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://notifications_svc:notificationspassword@db:5432/notifications_db
      - JWKS_URL=http://identity:8000/internal/v1/jwks
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notifications-worker:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: dev
    working_dir: /srv/services/notifications/src
    volumes:
      - ./services/notifications/src:/srv/services/notifications/src:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
    environment:
      - DATABASE_URL=postgresql://notifications_svc:notificationspassword@db:5432/notifications_db
      - JWKS_URL=http://identity:8000/internal/v1/jwks
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - LOG_LEVEL=INFO
    command: ["watchfiles", "python -m infrastructure.worker", "/srv/services/notifications/src", "/srv/libs/chassis/src"]
    depends_on:
      notifications:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      gateway:
        condition: service_healthy

  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    volumes:
      - ./docs/content:/docs/content:ro
    ports:
      - "8002:8000"

  test-consumer:
    profiles: ["demo"]
    build:
      context: ./test-consumer
      dockerfile: Dockerfile
    ports:
      - "8003:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9095
      - LEADS_API_BASE=http://gateway:8080/api/v1
    volumes:
      - inboxdata:/data
    depends_on:
      gateway:
        condition: service_healthy

  notifications-test:
    profiles: ["test"]
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: test
    volumes:
      - ./services/notifications/src:/srv/services/notifications/src:ro
      - ./services/notifications/tests:/srv/services/notifications/tests:ro
      - ./services/notifications/migrations:/srv/services/notifications/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
      - ./contracts:/srv/contracts:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://notifications_svc:notificationspassword@db:5432/notifications_test
      - TEST_DATABASE_URL=postgresql://notifications_svc:notificationspassword@db:5432/notifications_test
      - PYTHONDONTWRITEBYTECODE=1
    command: ["pytest", "-q"]

  identity-test:
    profiles: ["test"]
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: test
    volumes:
      - ./services/identity/src:/srv/services/identity/src:ro
      - ./services/identity/tests:/srv/services/identity/tests:ro
      - ./services/identity/migrations:/srv/services/identity/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
      - ./contracts:/srv/contracts:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://identity_svc:identitypassword@db:5432/identity_test
      - TEST_DATABASE_URL=postgresql://identity_svc:identitypassword@db:5432/identity_test
      - PYTHONDONTWRITEBYTECODE=1
    command: ["pytest", "-q"]

  intake-test:
    profiles: ["test"]
    build:
      context: ./services/intake
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: test
    volumes:
      - ./services/intake/src:/srv/services/intake/src:ro
      - ./services/intake/tests:/srv/services/intake/tests:ro
      - ./services/intake/migrations:/srv/services/intake/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
      - ./contracts:/srv/contracts:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://intake_svc:intakepassword@db:5432/intake_test
      - TEST_DATABASE_URL=postgresql://intake_svc:intakepassword@db:5432/intake_test
      - PYTHONDONTWRITEBYTECODE=1
    command: ["pytest", "-q"]

  lead-core-test:
    profiles: ["test"]
    build:
      context: ./services/lead-core
      dockerfile: Dockerfile
      additional_contexts:
        chassis: ./libs/chassis
      target: test
    volumes:
      - ./services/lead-core/src:/srv/services/lead-core/src:ro
      - ./services/lead-core/tests:/srv/services/lead-core/tests:ro
      - ./services/lead-core/migrations:/srv/services/lead-core/migrations:ro
      - ./libs/chassis/src:/srv/libs/chassis/src:ro
      - ./contracts:/srv/contracts:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      - DATABASE_URL=postgresql://lead_core_svc:leadcorepassword@db:5432/leads_test
      - TEST_DATABASE_URL=postgresql://lead_core_svc:leadcorepassword@db:5432/leads_test
      - PYTHONDONTWRITEBYTECODE=1
    command: ["pytest", "-q"]

volumes:
  pgdata:
  kafkadata:
  inboxdata:
