[project]
name = "identity"
version = "0.1.0"
description = "Identity service: organizations, agents, sessions and the tokens every other service trusts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "confluent-kafka>=2.5.0",
    "bcrypt>=4.0.1,<4.1",
    "cryptography>=50.0.1",
    "pyotp>=2.10.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "chassis[kafka,postgres]",
]

[tool.uv.sources]
chassis = { path = "../../libs/chassis", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "chassis[contracts]",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: no database, no network, no environment variables",
    "integration: requires a live PostgreSQL test database",
    "e2e: full HTTP stack against a live PostgreSQL test database",
    "architecture: static analysis of the dependency rule",
]
