# Docker's embedded DNS. Re-resolved so a recreated gateway container (new IP)
# is picked up without restarting this one.
resolver 127.0.0.11 valid=10s ipv6=off;

# An upstream rather than a variable in proxy_pass: the URI part of
# proxy_pass keeps replacing /api/v1/ and no regex or rewrite is needed.
upstream gateway_api {
    zone gateway_api 64k;
    server gateway:8080 resolve;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Entry point, never cached: a stale index.html pins an old bundle.
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        # Hashed at build time: a new name means new content.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/v1/ {
        proxy_pass http://gateway_api/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
