// Verified against a real startup of apache/kafka:3.7.0 (ADR-0028): a
// mounted server.properties-style file is never merged by this image's
// entrypoint, so the per-listener `sasl.jaas.config` property approach
// silently never reaches the broker and it fails to bind its SASL listener.
// The JVM-standard static JAAS file, wired through KAFKA_OPTS below, is what
// actually works.
//
// No username/password: this broker never acts as a SASL client of itself
// (KAFKA_INTER_BROKER_LISTENER_NAME stays PLAINTEXT), so this only enables
// the mechanism server-side. Real credentials live in the cluster's own
// SCRAM store, not here.
KafkaServer {
    org.apache.kafka.common.security.scram.ScramLoginModule required;
};
